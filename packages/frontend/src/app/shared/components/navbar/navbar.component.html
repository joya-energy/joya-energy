<header
  class="nav nav--full"
  [class.is-scrolled]="isScrolled()"
  [class.is-open]="isMobileMenuOpen()"
  [class.is-scrolling]="isNavbarHidden()"
  role="banner"
>
  <div class="nav__bar">
    <a routerLink="/" class="nav__logo" aria-label="Joya Energy — accueil" (click)="closeMobileMenu()">
      <img
        src="/handoff/brand/joya-energy-logo.png"
        alt="Joya Energy"
        class="nav__logo-img"
        width="120"
        height="30"
      />
    </a>

    <nav class="nav__links" aria-label="Navigation principale">
      <a
        routerLink="/notre-solution"
        [attr.aria-current]="isActive('/notre-solution') ? 'page' : null"
      >
        Solution
      </a>
      <a routerLink="/secteurs" [attr.aria-current]="isActive('/secteurs') ? 'page' : null">
        Secteurs
      </a>
      <a
        routerLink="/installateur-partenaire"
        [attr.aria-current]="isActive('/installateur-partenaire') ? 'page' : null"
      >
        Partenaires
      </a>

      <div class="nav__dd" [class.is-open]="isResourcesOpen()">
        <button
          type="button"
          class="nav__dd-btn"
          aria-haspopup="true"
          [attr.aria-expanded]="isResourcesOpen()"
          [attr.aria-current]="isResourcesActive() ? 'page' : null"
          aria-controls="ddRes"
          (click)="toggleResources($event)"
        >
          Ressources
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path
              d="M2.5 4.5 6 8l3.5-3.5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="nav__dd-menu" id="ddRes">
          <a routerLink="/ressources" fragment="outils" (click)="isResourcesOpen.set(false)">
            <b>Simulateurs</b>
            <small>Audit solaire, facture, subventions…</small>
          </a>
          <a routerLink="/ressources" fragment="blog" (click)="isResourcesOpen.set(false)">
            <b>Blog</b>
            <small>Guides et retours d'expérience</small>
          </a>
        </div>
      </div>
    </nav>

    <a [href]="startProjectUrl" class="btn btn-primary">
      <span>Lancer mon projet</span>
      <span class="btn-puck" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
          <path
            d="M3 11L11 3M11 3H4.5M11 3V9.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </a>

    <a [href]="loginUrl" class="nav__contact" aria-label="Connexion">
      <svg
        class="ic"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="3.2" />
        <path d="M5.2 19.2c1.3-2.7 3.5-4 6.8-4s5.5 1.3 6.8 4" />
      </svg>
      <span>Connexion</span>
    </a>

    <button
      type="button"
      class="nav__toggle"
      [attr.aria-expanded]="isMobileMenuOpen()"
      [attr.aria-label]="isMobileMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMobileMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="nav__mobile-panel" [attr.hidden]="!isMobileMenuOpen() ? true : null">
      <a
        routerLink="/notre-solution"
        [attr.aria-current]="isActive('/notre-solution') ? 'page' : null"
        (click)="closeMobileMenu()"
      >
        Solution
      </a>
      <a
        routerLink="/secteurs"
        [attr.aria-current]="isActive('/secteurs') ? 'page' : null"
        (click)="closeMobileMenu()"
      >
        Secteurs
      </a>
      <a
        routerLink="/installateur-partenaire"
        [attr.aria-current]="isActive('/installateur-partenaire') ? 'page' : null"
        (click)="closeMobileMenu()"
      >
        Partenaires
      </a>
      <button
        type="button"
        class="nav__mdd-btn"
        [attr.aria-expanded]="isMobileResourcesOpen()"
        [attr.aria-current]="isResourcesActive() ? 'page' : null"
        aria-controls="mddRes"
        (click)="toggleMobileResources()"
      >
        Ressources
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path
            d="M2.5 4.5 6 8l3.5-3.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div class="nav__mdd-sub" id="mddRes" [hidden]="!isMobileResourcesOpen()">
        <a routerLink="/ressources" fragment="outils" (click)="closeMobileMenu()">Simulateurs</a>
        <a routerLink="/ressources" fragment="blog" (click)="closeMobileMenu()">Blog</a>
      </div>
    </div>
  </div>
</header>
